<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مصراف العملات - تحويل فوري</title>
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="exchange-card">
    <div class="card-header">
        <h1>المصارفة الذكية</h1>
        <p>حوّل فوراً بين الريال اليمني، الريال السعودي، والدولار الأمريكي</p>
    </div>

    <div class="input-section">
        <div class="field-group">
            <div class="amount-field">
                <label>💰 المبلغ</label>
                <input type="number" id="amountInput" placeholder="أدخل المبلغ" value="100" step="any">
                <div class="hint">يمكنك إدخال أرقام صحيحة أو عشرية</div>
            </div>
            <div class="currency-field">
                <label>💱 عملة الإدخال</label>
                <select id="baseCurrency">
                    <option value="USD">🇺🇸 دولار أمريكي (USD)</option>
                    <option value="SAR">🇸🇦 ريال سعودي (SAR)</option>
                    <option value="YER">🇾🇪 ريال يمني (YER)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="exchange-btn-wrapper">
        <button id="exchangeBtn" class="exchange-btn">
            <span>🔄</span> مصارفة
        </button>
    </div>

    <!-- منطقة عرض الأخطاء -->
    <div id="errorContainer" style="min-height: 48px;"></div>

    <!-- نتائج المصارفة -->
    <div id="resultPanel" class="result-panel">
        <div class="result-title">
            <span>📊</span> نتائج المصارفة
        </div>
        <div id="resultsList">
            <!-- سيتم ملء النتائج ديناميكياً عبر JS -->
            <div style="text-align: center; padding: 1rem; color: #7493aa;">⬅️ أدخل المبلغ واختر العملة ثم اضغط "مصارفة"</div>
        </div>
        <div class="small-note">
            الأسعار المرجعية: 1 USD = 3.79 SAR ، 1 USD = 420 YER (للتوضيح)
        </div>
    </div>
</div>
<script src="js/mine.js"></script>
</body>
</html>
